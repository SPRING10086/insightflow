name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Run unittest suite
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      # GUI tests are part of the suite above; this step makes the coverage
      # explicit and keeps the console encoding deterministic.  Tests that need
      # a desktop session skip themselves when Tk cannot open a window.
      - name: GUI tests (headless-safe)
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: >
          python -m unittest
          tests.test_gui_shell
          tests.test_gui_stage1
          tests.test_gui_stage2
          tests.test_gui_stage3
          tests.test_gui_stage4
          -v

      - name: Offline / no-network check
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_gui_stage4.PackagingAndSafetyTests.test_source_has_no_network_imports -v

      # P2-3: independent reconciliation of a real run's artifacts.
      - name: Reconcile a demo run
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: |
          python -m insightflow demo --date 2026-11-07
          python scripts/reconcile.py output/2026-11-07

      # P2-3: coverage gate.  Commercial target is 85%; measured 85.2%, so the
      # gate now enforces the target instead of a ratchet baseline.
      - name: Coverage gate (core >= 85%)
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/coverage_gate.py --threshold 85
